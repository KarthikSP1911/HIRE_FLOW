# Local development dependencies. Usage: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: hireflow-postgres
    environment:
      POSTGRES_DB: hireflow_core
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hireflow -d hireflow_core']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
