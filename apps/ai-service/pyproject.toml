[project]
name = "ai-service"
version = "0.1.0"
description = "HIRE FLOW AI service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av<17",
    "fastapi[standard]>=0.162.6",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["ollama: needs a running local Ollama server with the rating model pulled"]
# Real-model tests take minutes on CPU, so they only run on request: pytest -m ollama
addopts = "-m 'not ollama'"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type stubs are published for these.
module = ["faster_whisper", "ctranslate2"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
